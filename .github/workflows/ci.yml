name: CI

on:
  push:
    branches: [main, "dev/**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run build
      - run: node --check main.js
      - uses: actions/upload-artifact@v4
        with:
          name: dashflow-plugin
          path: |
            main.js
            manifest.json
            styles.css
      - name: Package full development source
        run: |
          zip -r DashFlow-v0.5.6-full-source.zip \
            .github \
            .gitignore \
            ARCHITECTURE.md \
            README.md \
            esbuild.config.mjs \
            examples \
            manifest.json \
            package.json \
            src \
            styles.css \
            tests \
            tsconfig.json \
            versions.json
      - uses: actions/upload-artifact@v4
        with:
          name: dashflow-source
          path: DashFlow-v0.5.6-full-source.zip
