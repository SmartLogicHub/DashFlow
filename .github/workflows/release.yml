name: Release

on:
  push:
    tags: ["[0-9]*.[0-9]*.[0-9]*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node --check main.js
      - name: Validate release metadata
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          if [ "$GITHUB_REF_NAME" != "$VERSION" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match manifest version $VERSION." >&2
            exit 1
          fi
          if ! test -f LICENSE; then
            echo "Release blocked: choose and commit a LICENSE before publishing." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Package installable plugin
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: zip -r "DashFlow-v$VERSION.zip" main.js manifest.json styles.css assets/heroes
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists. Bump manifest.json before publishing again." >&2
            exit 1
          fi
          gh release create "$VERSION" \
            "DashFlow-v$VERSION.zip" main.js manifest.json styles.css assets/heroes/*.webp \
            --target "$GITHUB_SHA" \
            --title "DashFlow v$VERSION" \
            --generate-notes
